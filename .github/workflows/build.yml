name: Build

on:
  push:
    branches: [ "dev", "ci" ]
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/build.yml'
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "10G"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up ccache
        uses: Chocobo1/setup-ccache-action@v1
        with:
          remove_stale_cache: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      
      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle
            echo 'org.gradle.caching=true' >> ~/.gradle/gradle.properties
            echo 'org.gradle.parallel=true' >> ~/.gradle/gradle.properties
            echo 'org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:+UseParallelGC' >> ~/.gradle/gradle.properties
            echo 'android.native.buildOutput=verbose' >> ~/.gradle/gradle.properties
      - name: Configure Signing
        run: |
          keytool -genkeypair -v -keystore keystore.jks -alias kunigram -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Kunigram, OU=Kunigram, O=Kunigram, L=City, S=State, C=RU"
          echo "storeFile=${{ github.workspace }}/keystore.jks" >> local.properties
          echo "storePassword=123456" >> local.properties
          echo "keyAlias=kunigram" >> local.properties
          echo "keyPassword=123456" >> local.properties

      - name: Configure Secrets
        run: |
          echo "apiId=38296102" >> local.properties
          echo "apiHash=fd90877fc93fc99e75471dd39582f666" >> local.properties
          echo "mapsApiKey=fake" >> local.properties
          echo "helperBotId=0" >> local.properties
          echo "helperBotUsername=bot" >> local.properties
          echo "sentryDsn=[https://fake@sentry.io/1](https://fake@sentry.io/1)" >> local.properties
          echo '{"project_info":{"project_number":"0","project_id":"kunigram","storage_bucket":"kunigram.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"tw.nekomimi.nekogram"}},"oauth_client":[],"api_key":[{"current_key":"fake"}],"services":{}},{"client_info":{"mobilesdk_app_id":"1:0:android:1","android_client_info":{"package_name":"nekox.messenger"}},"oauth_client":[],"api_key":[{"current_key":"fake"}],"services":{}},{"client_info":{"mobilesdk_app_id":"1:0:android:2","android_client_info":{"package_name":"org.telegram.messenger"}},"oauth_client":[],"api_key":[{"current_key":"fake"}],"services":{}},{"client_info":{"mobilesdk_app_id":"1:0:android:3","android_client_info":{"package_name":"org.telegram.messenger.web"}},"oauth_client":[],"api_key":[{"current_key":"fake"}],"services":{}}],"configuration_version":"1"}' > TMessagesProj_App/google-services.json
          touch sentry.properties

      - name: Build with Gradle
        run: |
          ./gradlew assembleRelease -x uploadSentryProguardMappingsRelease -x uploadSentryNativeSymbolsForRelease -x sentryBundleSourcesRelease

      - name: Attest
        uses: actions/attest@v4
        with:
          subject-path: '${{ github.workspace }}/TMessagesProj_App/build/outputs'

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: outputs
          path: TMessagesProj_App/build/outputs

      - name: Upload arm64-v8a build apk
        uses: actions/upload-artifact@v7
        with:
          path: TMessagesProj_App/build/outputs/apk/release/*-arm64-v8a.apk
          archive: false

      - name: Upload armeabi-v7a build apk
        uses: actions/upload-artifact@v7
        with:
          path: TMessagesProj_App/build/outputs/apk/release/*-armeabi-v7a.apk
          archive: false

      - name: Upload universal build apk
        uses: actions/upload-artifact@v7
        with:
          path: TMessagesProj_App/build/outputs/apk/release/*-universal.apk
          archive: false

      - name: Upload x86 build apk
        uses: actions/upload-artifact@v7
        with:
          path: TMessagesProj_App/build/outputs/apk/release/*-x86.apk
          archive: false

      - name: Upload x86_64 build apk
        uses: actions/upload-artifact@v7
        with:
          path: TMessagesProj_App/build/outputs/apk/release/*-x86_64.apk
          archive: false

      - name: Upload build bundle
        uses: actions/upload-artifact@v7
        with:
          path: TMessagesProj_App/build/outputs/bundle/play/*-play.aab
          archive: false
